<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="A TikTok-style memories + wishlist index for your travel pages." />
  <title>Trip Memories</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>

  <style>
    :root{
      --bg:#050508;
      --text:#F5F5FA;
      --muted: rgba(245,245,250,.72);
      --muted2: rgba(245,245,250,.55);
      --accent:#ff0050;
      --accent2:#00f2ea;
      --line: rgba(255,255,255,.10);
      --radius: 18px;
      --shadow: 0 18px 40px rgba(0,0,0,.45);

      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    *{ box-sizing:border-box; }
    html, body{ height:100%; }
    body{
      margin:0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(1200px 800px at 20% 10%, rgba(255,0,80,.12), transparent 60%),
                  radial-gradient(1000px 700px at 85% 25%, rgba(0,242,234,.10), transparent 55%),
                  var(--bg);
      color:var(--text);
      overflow:hidden;
    }
    a{ color:inherit; text-decoration:none; }
    button{ font:inherit; }

    .app{ height:100%; display:flex; flex-direction:column; }

    .topbar{
      padding: calc(14px + var(--safe-top)) 18px 12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      border-bottom: 1px solid var(--line);
      background: rgba(5,5,8,.55);
      backdrop-filter: blur(14px);
    }
    .brand{ display:flex; align-items:center; gap:10px; min-width:0; }
    .brand .dot{
      width:10px; height:10px; border-radius:50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 0 18px rgba(255,0,80,.35), 0 0 18px rgba(0,242,234,.25);
      flex:0 0 auto;
    }
    .brand-wrap{ min-width:0; }
    .brand .title{ font-weight:800; letter-spacing:.2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .brand .subtitle{ color: var(--muted2); font-size:.9rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    .actions{ display:flex; gap:10px; align-items:center; }
    .icon-btn{
      width:40px; height:40px;
      border-radius:12px;
      border:1px solid var(--line);
      background: rgba(255,255,255,.05);
      color: var(--text);
      display:grid; place-items:center;
      cursor:pointer;
      transition: transform .15s ease, background .15s ease;
    }
    .icon-btn:hover{ transform: translateY(-1px); background: rgba(255,255,255,.08); }

    /* Section toggle (Memories / Wishlist) */
    .seg{
      display:flex;
      gap:6px;
      padding: 6px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.05);
      backdrop-filter: blur(14px);
      flex: 0 0 auto;
    }
    .seg-btn{
      border:none;
      background: transparent;
      color: rgba(245,245,250,.75);
      padding: 8px 12px;
      border-radius: 999px;
      cursor:pointer;
      font-weight: 800;
      letter-spacing:.2px;
      display:flex;
      align-items:center;
      gap:8px;
      transition: background .15s ease, color .15s ease;
    }
    .seg-btn.active{
      color: rgba(245,245,250,.95);
      background: rgba(255,255,255,.08);
    }

    .feed-wrap{ position:relative; flex:1; min-height:0; }
    .feed{
      height:100%;
      overflow-y:auto;
      scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;
    }
    .post{
      height: calc(100vh - 64px - 64px - var(--safe-top) - var(--safe-bottom));
      min-height: 520px;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      position:relative;
      display:flex;
      align-items:stretch;
      justify-content:center;
      padding: 18px;
    }
    .frame{
      width: min(980px, 100%);
      height: 100%;
      border-radius: var(--radius);
      position:relative;
      overflow:hidden;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.02);
    }
    .bg{ position:absolute; inset:0; transform: scale(1.02); filter: saturate(1.15) contrast(1.05); }
    .bg::after{
      content:'';
      position:absolute; inset:0;
      background: radial-gradient(900px 600px at 10% 20%, rgba(255,255,255,.08), transparent 55%),
                  linear-gradient(180deg, rgba(0,0,0,.15), rgba(0,0,0,.55));
      pointer-events:none;
    }

    .hud{
      position:absolute; inset:0;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      padding: 16px 16px 14px;
    }
    .hud-top{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .chips{ display:flex; gap:8px; flex-wrap:wrap; }
    .chip{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(0,0,0,.35);
      border: 1px solid rgba(255,255,255,.14);
      color: rgba(255,255,255,.92);
      font-weight: 600;
      font-size: .85rem;
      backdrop-filter: blur(8px);
    }
    .chip .pill{
      width:8px; height:8px; border-radius:50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 0 10px rgba(255,0,80,.35);
    }
    .chip.wish .pill{
      background: linear-gradient(135deg, rgba(241,196,83,1), rgba(0,242,234,1));
      box-shadow: 0 0 12px rgba(241,196,83,.35);
    }

    .hud-bottom{ display:flex; align-items:flex-end; justify-content:space-between; gap:18px; }
    .caption{ max-width: 72ch; min-width:0; }
    .place{
      display:flex;
      align-items:center;
      gap:10px;
      font-weight: 800;
      font-size: clamp(1.35rem, 3.2vw, 2.2rem);
      letter-spacing:.2px;
      line-height:1.1;
    }
    .place .emoji{ filter: drop-shadow(0 10px 18px rgba(0,0,0,.45)); }
    .sub{ margin-top:10px; color: rgba(255,255,255,.80); font-weight:500; line-height:1.35; }

    .note-preview{
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(0,0,0,.35);
      border: 1px solid rgba(255,255,255,.12);
      color: rgba(255,255,255,.78);
      display:none;
    }
    .note-preview.show{ display:block; }

    .open-pill{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding: 12px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(0,0,0,.35);
      backdrop-filter: blur(10px);
      cursor:pointer;
      font-weight: 800;
      color: rgba(255,255,255,.92);
      margin-top: 14px;
      transition: transform .15s ease, background .15s ease;
    }
    .open-pill:hover{ transform: translateY(-1px); background: rgba(0,0,0,.45); }

    .right-rail{ display:flex; flex-direction:column; gap:12px; align-items:center; padding-bottom: 6px; }
    .rail-btn{
      width: 52px;
      height: 52px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.32);
      color: rgba(255,255,255,.92);
      display:grid;
      place-items:center;
      cursor:pointer;
      backdrop-filter: blur(10px);
      transition: transform .15s ease, background .15s ease;
    }
    .rail-btn:hover{ transform: translateY(-1px); background: rgba(0,0,0,.42); }
    .rail-label{ font-size:.78rem; color: rgba(255,255,255,.75); text-align:center; margin-top: -6px; }

    .dots{
      position:absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      display:flex;
      flex-direction:column;
      gap:8px;
      z-index: 10;
      padding: 10px 8px;
      border-radius: 999px;
      background: rgba(0,0,0,.22);
      border: 1px solid rgba(255,255,255,.10);
      backdrop-filter: blur(10px);
    }
    .dot{ width: 6px; height: 18px; border-radius: 999px; background: rgba(255,255,255,.18); cursor:pointer; transition: background .15s ease, transform .15s ease; }
    .dot.active{ background: linear-gradient(180deg, var(--accent), var(--accent2)); transform: scaleX(1.25); }
    .dot.active.wish{ background: linear-gradient(180deg, rgba(241,196,83,1), rgba(0,242,234,1)); }

    .bottomnav{
      height: calc(64px + var(--safe-bottom));
      padding: 10px 14px calc(10px + var(--safe-bottom));
      border-top: 1px solid var(--line);
      background: rgba(5,5,8,.60);
      backdrop-filter: blur(14px);
      display:flex;
      align-items:center;
      justify-content:space-around;
      gap:10px;
    }
    .navbtn{
      min-width: 74px;
      border: none;
      background: transparent;
      color: rgba(245,245,250,.70);
      display:flex;
      flex-direction:column;
      gap:6px;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      padding: 6px 10px;
      border-radius: 14px;
      transition: background .15s ease, color .15s ease;
    }
    .navbtn.active{ color: rgba(245,245,250,.95); background: rgba(255,255,255,.06); }
    .navbtn .label{ font-size:.78rem; font-weight:800; letter-spacing:.2px; }

    /* Modal */
    .modal-backdrop{
      position:fixed; inset:0;
      background: rgba(0,0,0,.55);
      display:none;
      align-items:flex-end;
      justify-content:center;
      z-index: 50;
    }
    .modal-backdrop.show{ display:flex; }
    .modal{
      width: min(760px, 100%);
      border-radius: 18px 18px 0 0;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(10,10,18,.92);
      backdrop-filter: blur(16px);
      box-shadow: 0 -20px 40px rgba(0,0,0,.45);
      padding: 14px 14px 18px;
    }
    .modal-handle{ width: 44px; height: 5px; border-radius: 999px; background: rgba(255,255,255,.18); margin: 6px auto 12px; }
    .modal-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding: 0 4px 12px; border-bottom: 1px solid rgba(255,255,255,.08); }
    .modal-title{ font-weight: 900; }
    .modal-close{
      width: 40px; height: 40px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color: rgba(255,255,255,.92);
      cursor:pointer;
    }

    .field{ margin-top: 14px; display:flex; gap:10px; align-items:center; }
    .input{
      flex:1;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.25);
      color: rgba(255,255,255,.92);
      padding: 12px 14px;
      outline:none;
    }
    .btn{
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.14);
      background: linear-gradient(135deg, rgba(255,0,80,.35), rgba(0,242,234,.25));
      color: rgba(255,255,255,.92);
      padding: 12px 14px;
      cursor:pointer;
      font-weight: 900;
    }
    .btn.wish{ background: linear-gradient(135deg, rgba(241,196,83,.30), rgba(0,242,234,.22)); }

    .list{ margin-top: 14px; display:flex; flex-direction:column; gap:10px; max-height: 52vh; overflow:auto; padding-right: 4px; }
    .row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding: 12px 12px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.05);
    }
    .row-left{ min-width:0; }
    .row-title{ font-weight: 900; }
    .row-sub{ color: rgba(255,255,255,.70); font-size:.9rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .row-open{
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(0,0,0,.22);
      color: rgba(255,255,255,.92);
      padding: 10px 12px;
      cursor:pointer;
      font-weight: 900;
      white-space:nowrap;
    }

    @media (max-width: 520px){
      .post{ padding: 12px; }
      .dots{ right: 6px; }
    }

    @media (prefers-reduced-motion: reduce){
      *{ scroll-behavior:auto !important; transition:none !important; animation:none !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="dot" aria-hidden="true"></div>
        <div class="brand-wrap">
          <div class="title">Trip Memories</div>
          <div class="subtitle" id="brandSubtitle">Swipe your pages like a feed</div>
        </div>
      </div>

      <div class="seg" role="tablist" aria-label="Section">
        <button class="seg-btn active" id="segMem" role="tab" aria-selected="true"><i class="fa-regular fa-heart"></i>Memories</button>
        <button class="seg-btn" id="segWish" role="tab" aria-selected="false"><i class="fa-regular fa-star"></i>Wishlist</button>
      </div>

      <div class="actions">
        <button class="icon-btn" id="btnSearch" title="Search / Jump"><i class="fa-solid fa-magnifying-glass"></i></button>
        <button class="icon-btn" id="btnHelp" title="Shortcuts"><i class="fa-regular fa-circle-question"></i></button>
      </div>
    </header>

    <div class="feed-wrap">
      <div class="dots" id="dots" aria-label="Feed progress"></div>
      <main class="feed" id="feed" aria-label="Trip feed"></main>
    </div>

    <nav class="bottomnav" aria-label="Bottom navigation">
      <button class="navbtn active" id="navHome"><i class="fa-solid fa-house"></i><span class="label">Home</span></button>
      <button class="navbtn" id="navSearch"><i class="fa-regular fa-compass"></i><span class="label">Search</span></button>
      <button class="navbtn" id="navFav"><i class="fa-regular fa-heart"></i><span class="label">Faves</span></button>
      <button class="navbtn" id="navKeys"><i class="fa-regular fa-keyboard"></i><span class="label">Keys</span></button>
    </nav>
  </div>

  <!-- Modal -->
  <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal">
      <div class="modal-handle" aria-hidden="true"></div>
      <div class="modal-head">
        <div class="modal-title" id="modalTitle">Search</div>
        <button class="modal-close" id="modalClose" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="field" id="searchField">
        <input class="input" id="searchInput" placeholder="Type a place or year (e.g., Bali, 2026)..." />
        <button class="btn" id="searchClear">Clear</button>
      </div>

      <div class="field" id="noteField" style="display:none;">
        <input class="input" id="noteInput" placeholder="Write a quick memory (saved locally)..." />
        <button class="btn" id="noteSave">Save</button>
      </div>

      <div class="list" id="modalList"></div>
    </div>
  </div>

  <script>
/**
 * This index is driven by manifest.json (so you can add/remove pages without editing Index.html).
 * Notes:
 * - If you open Index.html directly via file://, browsers may block fetch(). This page will fall back to DEFAULT_MANIFEST.
 * - For best results, run a local server:  python -m http.server 8000  and open http://localhost:8000/
 */
let PAGES = [];

const DEFAULT_MANIFEST = {
  "memories": [
    {
      "file": "pages/2026_Xian.html",
      "cover": "covers/2026_Xian.png",
      "place": "Xi'an",
      "year": 2026
    },
    {
      "file": "pages/2024_KL.html",
      "cover": "covers/2024_KL.png",
      "place": "Kuala Lumpur",
      "year": 2024
    },
    {
      "file": "pages/2018_Phuket.html",
      "cover": "covers/2018_Phuket.png",
      "place": "Phuket",
      "year": 2018
    },
    {
      "file": "pages/2016_HK.html",
      "cover": "covers/2016_HK.png",
      "place": "Hong Kong",
      "year": 2016
    },
    {
      "file": "pages/2014_Macau.html",
      "cover": "covers/2014_Macau.png",
      "place": "Macau",
      "year": 2014
    },
    {
      "file": "pages/2012_Taiwan.html",
      "cover": "covers/2012_Taiwan.png",
      "place": "Taiwan",
      "year": 2012
    }
  ],
  "wishlist": [
    {
      "file": "pages/XXXX_Bali.html",
      "cover": "covers/XXXX_Bali.png",
      "place": "Bali"
    },
    {
      "file": "pages/XXXX_Chongqing.html",
      "cover": "covers/XXXX_Chongqing.png",
      "place": "Chongqing"
    },
    {
      "file": "pages/XXXX_Mexico.html",
      "cover": "covers/XXXX_Mexico.png",
      "place": "Mexico"
    },
    {
      "file": "pages/XXXX_Saigon.html",
      "cover": "covers/XXXX_Saigon.png",
      "place": "Saigon"
    }
  ],
  "coversDir": "covers"
};

async function loadManifest() {
  try {
    const res = await fetch("manifest.json", { cache: "no-store" });
    if (!res.ok) throw new Error("manifest fetch failed: " + res.status);
    const data = await res.json();
    if (!data || !Array.isArray(data.memories) || !Array.isArray(data.wishlist)) throw new Error("bad manifest shape");
    return data;
  } catch (e) {
    console.warn("Using DEFAULT_MANIFEST (manifest.json couldn't be loaded).", e);
    return DEFAULT_MANIFEST;
  }
}

function baseName(file){
  const s = String(file || "");
  const parts = s.split("/");
  return parts[parts.length - 1] || s;
}

function fileStem(file) {
  return baseName(file).replace(/\.[^.]+$/, "");
}

function parseYearFromFile(file) {
  const m = baseName(file).match(/^(\d{4})_/);
  return m ? Number(m[1]) : null;
}

function parsePlaceFromFile(file) {
  const stem = fileStem(file);
  let s = stem.replace(/^\d{4}_/, "").replace(/^XXXX_/i, "");
  s = s.replace(/_/g, " ").trim();
  return s || stem;
}

function isPlannedFile(file) {
  return /^XXXX_/i.test(baseName(file));
}

function bgFor(place) {
  const key = String(place || "").toLowerCase();
  let a = "rgba(0,168,255,.22)", b = "rgba(255,71,87,.18)";
  if (key.includes("saigon")) { a="rgba(0,206,201,.30)"; b="rgba(108,92,231,.28)"; }
  else if (key.includes("xian") || key.includes("xi'an")) { a="rgba(37,117,252,.28)"; b="rgba(106,17,203,.26)"; }
  else if (key.includes("bali")) { a="rgba(42,157,143,.28)"; b="rgba(231,111,81,.22)"; }
  else if (key.includes("chong")) { a="rgba(0,255,255,.22)"; b="rgba(255,0,128,.20)"; }
  else if (key.includes("mex")) { a="rgba(230,57,70,.20)"; b="rgba(244,162,97,.18)"; }
  else if (key === "kl" || key.includes("kuala lumpur")) { a="rgba(0,168,255,.22)"; b="rgba(138,43,226,.18)"; }
  else if (key.includes("taiwan")) { a="rgba(0,242,234,.18)"; b="rgba(255,0,80,.14)"; }
  else if (key.includes("macau")) { a="rgba(255,193,7,.18)"; b="rgba(255,0,80,.12)"; }
  else if (key === "hk" || key.includes("hong kong")) { a="rgba(0,168,255,.18)"; b="rgba(255,0,128,.12)"; }
  else if (key.includes("phuket")) { a="rgba(42,157,143,.18)"; b="rgba(244,162,97,.14)"; }

  const base = "#050508";
  return `radial-gradient(1200px 800px at 20% 30%, ${a}, transparent 60%),
          radial-gradient(900px 700px at 85% 20%, ${b}, transparent 55%),
          linear-gradient(180deg, ${base}, #0a0a0f 60%, #040406)`;
}

function emojiFor(place) {
  const key = String(place || "").toLowerCase();
  if (key.includes("saigon")) return "🛵";
  if (key.includes("xian") || key.includes("xi'an")) return "🏯";
  if (key.includes("bali")) return "🌴";
  if (key.includes("chong")) return "🌉";
  if (key.includes("mex")) return "🌮";
  if (key === "kl" || key.includes("kuala lumpur")) return "🏙️";
  if (key.includes("taiwan")) return "🧋";
  if (key.includes("macau")) return "🎲";
  if (key === "hk" || key.includes("hong kong")) return "🌃";
  if (key.includes("phuket")) return "🏝️";
  return "📍";
}

function coverFor(manifest, file) {
  const dir = (manifest && manifest.coversDir) ? String(manifest.coversDir) : "covers";
  const d = dir.replace(/\/+$/,"");
  const stem = fileStem(file);
  if (!d || d === ".") return `${stem}.png`;
  return `${d}/${stem}.png`;
}

function normalizeEntry(x) {
  if (typeof x === "string") return { file: x };
  if (x && typeof x === "object" && x.file) return x;
  return null;
}

async function getTitleFromPage(file) {
  try {
    const res = await fetch(file, { cache: "no-store" });
    if (!res.ok) throw new Error("fetch failed");
    const text = await res.text();
    const doc = new DOMParser().parseFromString(text, "text/html");
    return (doc && doc.title) ? doc.title.trim() : null;
  } catch {
    return null;
  }
}

async function buildPagesFromManifest(man) {
  const pages = [];
  const add = (entry, section) => {
    const file = entry.file;
    const place = entry.place || parsePlaceFromFile(file);
    const year = entry.year ?? parseYearFromFile(file);
    const planned = isPlannedFile(file);
    pages.push({
      id: file,
      file,
      place,
      year,
      subtitle: entry.subtitle || entry.title || file,
      emoji: entry.emoji || emojiFor(place),
      bg: entry.bg || bgFor(place),
      section,
      planned,
      cover: entry.cover || coverFor(man, file),
    });
  };

  const mem = (man.memories || []).map(normalizeEntry).filter(Boolean);
  // Ensure Memories show newest -> oldest (even if manifest/default is out of order)
  mem.sort((a,b) => {
    const ay = (a && (a.year ?? parseYearFromFile(a.file))) ?? -1;
    const by = (b && (b.year ?? parseYearFromFile(b.file))) ?? -1;
    if (by !== ay) return by - ay;
    const ap = String(a.place || parsePlaceFromFile(a.file) || "");
    const bp = String(b.place || parsePlaceFromFile(b.file) || "");
    return bp.localeCompare(ap);
  });
  const wish = (man.wishlist || []).map(normalizeEntry).filter(Boolean);

  mem.forEach(e => add(e, "memories"));
  wish.forEach(e => add(e, "wishlist"));

  await Promise.all(pages.map(async p => {
    if (!p.subtitle || p.subtitle === p.file) {
      const t = await getTitleFromPage(p.file);
      if (t) p.subtitle = t;
    }
  }));

  return pages;
}

const LS_SECTION = 'trip_memories_section_v5';
const LS_FAV = 'trip_memories_favs_v5';
const LS_NOTES = 'trip_memories_notes_v5';

const feed = document.getElementById('feed');
const dots = document.getElementById('dots');

const segMem = document.getElementById('segMem');
const segWish = document.getElementById('segWish');
const brandSubtitle = document.getElementById('brandSubtitle');

const btnSearch = document.getElementById('btnSearch');
const btnHelp = document.getElementById('btnHelp');

const navHome = document.getElementById('navHome');
const navSearch = document.getElementById('navSearch');
const navFav = document.getElementById('navFav');
const navKeys = document.getElementById('navKeys');

const modalBackdrop = document.getElementById('modalBackdrop');
const modalTitle = document.getElementById('modalTitle');
const modalList = document.getElementById('modalList');
const modalClose = document.getElementById('modalClose');

const searchField = document.getElementById('searchField');
const searchInput = document.getElementById('searchInput');
const searchClear = document.getElementById('searchClear');

const noteField = document.getElementById('noteField');
const noteInput = document.getElementById('noteInput');
const noteSave = document.getElementById('noteSave');

const state = {
  section: localStorage.getItem(LS_SECTION) || 'memories',
  favs: new Set(JSON.parse(localStorage.getItem(LS_FAV) || '[]')),
  notes: JSON.parse(localStorage.getItem(LS_NOTES) || '{}'),
  noteEditingId: null,
};

function setActiveNav(btn){
  [navHome, navSearch, navFav, navKeys].forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function saveFavs(){ localStorage.setItem(LS_FAV, JSON.stringify(Array.from(state.favs))); }
function saveNotes(){ localStorage.setItem(LS_NOTES, JSON.stringify(state.notes)); }
function saveSection(){ localStorage.setItem(LS_SECTION, state.section); }

function escapeHtml(s){
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

function sectionFor(page){
  return page && page.section ? page.section : 'hidden';
}

function currentList(){
  return PAGES.filter(p => sectionFor(p) === state.section);
}

function updateSectionUI(){
  const isWish = state.section === 'wishlist';
  segMem.classList.toggle('active', !isWish);
  segWish.classList.toggle('active', isWish);
  segMem.setAttribute('aria-selected', String(!isWish));
  segWish.setAttribute('aria-selected', String(isWish));
  brandSubtitle.textContent = isWish
    ? "Wishlist — XXXX_* (tap anywhere to open)"
    : "Memories — 2026 → 2012 (tap anywhere to open)";
}

function openInNewTab(file){
  window.open(file, '_blank', 'noopener');
}

function buildPost(page, idx, total){
  const isFav = state.favs.has(page.id);
  const isWish = (sectionFor(page) === 'wishlist');
  const isPlanned = !!page.planned;

  const section = document.createElement('section');
  section.className = 'post';
  section.dataset.id = page.id;

  const placeLabel = page.place.replace('Xian', "Xi'an");

  section.innerHTML = `
    <div class="frame" role="button" tabindex="0" aria-label="Open ${escapeHtml(placeLabel)} in a new tab">
      <div class="bg-gradient" style="background:${page.bg}"></div>
      <div class="bg-cover" style="background-image:url('${page.cover}');"></div>
      <div class="bg-overlay"></div>

      <div class="hud">
        <div class="hud-top">
          <div class="chips">
            <div class="chip"><span class="pill"></span><span>${escapeHtml(placeLabel)}</span></div>
            ${page.year ? `<div class="chip"><i class="fa-regular fa-calendar"></i><span>${page.year}</span></div>` : ''}
            ${isWish
                ? (isPlanned
                    ? `<div class="chip tag-plan"><span class="pill"></span><span>Planned (XXXX)</span></div>`
                    : `<div class="chip tag-wish"><span class="pill"></span><span>Wishlist</span></div>`)
                : `<div class="chip"><i class="fa-solid fa-clock-rotate-left"></i><span>Memory</span></div>`}
          </div>
          <div class="chip" title="Tip: Use ↑/↓ keys to move">
            <i class="fa-solid fa-up-down"></i><span>${idx+1}/${total}</span>
          </div>
        </div>

        <div class="hud-bottom">
          <div class="caption">
            <div class="place">
              <span class="emoji" aria-hidden="true">${page.emoji}</span>
              <span>${escapeHtml(placeLabel)}</span>
            </div>
            <div class="sub">${escapeHtml(page.subtitle || "")}</div>
            <div class="hint"><i class="fa-solid fa-arrow-up-right-from-square"></i> Tap anywhere to open</div>
          </div>

          <div class="right-rail" aria-label="Actions">
            <div>
              <button class="rail-btn" data-action="fav" aria-label="Favorite">
                <i class="${isFav ? 'fa-solid' : 'fa-regular'} fa-heart"></i>
              </button>
              <div class="rail-label">${isFav ? 'Faved' : 'Fav'}</div>
            </div>

            <div>
              <button class="rail-btn" data-action="note" aria-label="Add note">
                <i class="fa-regular fa-note-sticky"></i>
              </button>
              <div class="rail-label">Note</div>
            </div>

            <div>
              <button class="rail-btn" data-action="share" aria-label="Copy link">
                <i class="fa-solid fa-link"></i>
              </button>
              <div class="rail-label">Copy</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  `;

  const frame = section.querySelector('.frame');

  frame.addEventListener('click', async (e) => {
    const btn = e.target.closest('button[data-action]');
    if (btn) {
      e.preventDefault();
      e.stopPropagation();
      const action = btn.dataset.action;

      if (action === 'fav') {
        if (state.favs.has(page.id)) state.favs.delete(page.id);
        else state.favs.add(page.id);
        saveFavs();
        const icon = btn.querySelector('i');
        const label = btn.parentElement.querySelector('.rail-label');
        const isNowFav = state.favs.has(page.id);
        icon.className = `${isNowFav ? 'fa-solid' : 'fa-regular'} fa-heart`;
        label.textContent = isNowFav ? 'Faved' : 'Fav';
        btn.animate([{transform:'scale(1)'},{transform:'scale(1.08)'},{transform:'scale(1)'}], {duration:180});
        return;
      }

      if (action === 'share') {
        const url = new URL(page.file, window.location.href).href;
        try {
          await navigator.clipboard.writeText(url);
          toast('Link copied');
        } catch {
          prompt('Copy this link:', url);
        }
        return;
      }

      if (action === 'note') {
        openNoteModal(page.id);
        return;
      }
      return;
    }

    openInNewTab(page.file);
  });

  frame.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      openInNewTab(page.file);
    }
  });

  return section;
}

function renderFeed(){
  const list = currentList();
  feed.innerHTML = '';
  dots.innerHTML = '';

  if (!list.length) {
    feed.innerHTML = `
      <div style="padding:24px; color: rgba(255,255,255,.75);">
        No pages in this section. Update <b>manifest.json</b>.
      </div>
    `;
    return;
  }

  list.forEach((p, idx) => {
    feed.appendChild(buildPost(p, idx, list.length));
    const d = document.createElement('div');
    d.className = 'dot';
    d.title = p.place + (sectionFor(p)==='wishlist' ? ' (Wishlist)' : ' (Memory)');
    d.addEventListener('click', () => scrollToIndex(idx));
    dots.appendChild(d);
  });

  updateDots();
  setTimeout(() => scrollToIndex(0), 0);
}

function getPosts(){ return Array.from(feed.querySelectorAll('.post')); }

function getVisibleIndex(){
  const posts = getPosts();
  if (!posts.length) return 0;

  const rect = feed.getBoundingClientRect();
  const mid = rect.top + rect.height * 0.35;

  let bestIdx = 0;
  let bestDist = Infinity;
  posts.forEach((p, idx) => {
    const r = p.getBoundingClientRect();
    const dist = Math.abs(r.top - mid);
    if (dist < bestDist) {
      bestDist = dist;
      bestIdx = idx;
    }
  });
  return bestIdx;
}

function updateDots(){
  const idx = getVisibleIndex();
  const list = currentList();

  Array.from(dots.querySelectorAll('.dot')).forEach((d, i) => {
    const p = list[i];
    const isActive = i === idx;
    d.classList.toggle('active', isActive);
    d.classList.toggle('wish', isActive && sectionFor(p)==='wishlist' && !p?.planned);
    d.classList.toggle('plan', isActive && sectionFor(p)==='wishlist' && !!p?.planned);
  });
}

function scrollToIndex(idx){
  const posts = getPosts();
  const el = posts[idx];
  if (!el) return;
  el.scrollIntoView({behavior:'smooth', block:'start'});
}

// Toast
let toastTimer = null;
function toast(msg){
  let el = document.getElementById('toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast';
    el.style.cssText = `
      position: fixed;
      left: 50%;
      bottom: calc(84px + var(--safe-bottom));
      transform: translateX(-50%);
      background: rgba(0,0,0,.70);
      border: 1px solid rgba(255,255,255,.14);
      padding: 10px 12px;
      border-radius: 999px;
      color: rgba(255,255,255,.92);
      font-weight: 900;
      backdrop-filter: blur(10px);
      z-index: 60;
      box-shadow: 0 10px 30px rgba(0,0,0,.45);
    `;
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.style.opacity = '0', 1200);
}

// Modal helpers
function openModal(title){
  modalTitle.textContent = title;
  modalBackdrop.classList.add('show');
  modalBackdrop.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
}
function closeModal(){
  modalBackdrop.classList.remove('show');
  modalBackdrop.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = 'hidden';
  state.noteEditingId = null;
  noteInput.value = '';
}

modalBackdrop.addEventListener('click', (e) => {
  if (e.target === modalBackdrop) closeModal();
});
modalClose.addEventListener('click', closeModal);

// Search modal
function openSearchModal(){
  searchField.style.display = '';
  noteField.style.display = 'none';
  openModal(state.section === 'wishlist' ? 'Search Wishlist' : 'Search Memories');
  searchInput.value = '';
  searchInput.focus();
  renderSearchList('');
}

function renderSearchList(q){
  const query = (q || '').trim().toLowerCase();
  const list = currentList().filter(t => {
    if (!query) return true;
    return (t.place + ' ' + (t.year || '') + ' ' + t.subtitle).toLowerCase().includes(query);
  });
  modalList.innerHTML = '';
  list.forEach(t => {
    const row = document.createElement('div');
    row.className = 'row';
    const placeLabel = t.place.replace('Xian', "Xi'an");
    const tag = sectionFor(t)==='wishlist' ? (t.planned ? ' · Planned (XXXX)' : ' · Wishlist') : ' · Memory';
    row.innerHTML = `
      <div class="row-left">
        <div class="row-title">${escapeHtml(placeLabel)}${t.year ? ` · ${t.year}` : ''}${tag}</div>
        <div class="row-sub">${escapeHtml(t.subtitle)}</div>
      </div>
      <button class="row-open"><i class="fa-solid fa-arrow-right"></i> Jump</button>
    `;
    row.querySelector('button').addEventListener('click', () => {
      closeModal();
      const idx = currentList().findIndex(x => x.id === t.id);
      if (idx >= 0) scrollToIndex(idx);
    });
    modalList.appendChild(row);
  });
  if (!list.length) {
    const empty = document.createElement('div');
    empty.style.cssText = 'padding:14px;color:rgba(255,255,255,.7);';
    empty.textContent = 'No matches.';
    modalList.appendChild(empty);
  }
}

searchInput.addEventListener('input', () => renderSearchList(searchInput.value));
searchClear.addEventListener('click', () => {
  searchInput.value = '';
  renderSearchList('');
  searchInput.focus();
});

// Notes
function openNoteModal(id){
  state.noteEditingId = id;
  searchField.style.display = 'none';
  noteField.style.display = '';
  openModal('Add a note');
  noteInput.value = (state.notes[id] || '');
  noteInput.focus();
  modalList.innerHTML = `
    <div class="row">
      <div class="row-left">
        <div class="row-title">Saved locally</div>
        <div class="row-sub">Notes live in your browser (localStorage).</div>
      </div>
    </div>
  `;
}

noteSave.addEventListener('click', () => {
  const id = state.noteEditingId;
  if (!id) return;
  const val = (noteInput.value || '').trim();
  if (val) state.notes[id] = val;
  else delete state.notes[id];
  saveNotes();
  closeModal();
  toast(val ? 'Note saved' : 'Note cleared');
});

function openFavs(){
  setActiveNav(navFav);
  searchField.style.display = 'none';
  noteField.style.display = 'none';
  openModal('Favorites');
  modalList.innerHTML = '';
  const favList = PAGES.filter(t => state.favs.has(t.id) && sectionFor(t) !== 'hidden');
  if (!favList.length) {
    modalList.innerHTML = `<div style="padding:14px;color:rgba(255,255,255,.7);">No favorites yet. Tap the heart on any page.</div>`;
    return;
  }
  favList.forEach(t => {
    const row = document.createElement('div');
    row.className = 'row';
    const placeLabel = t.place.replace('Xian', "Xi'an");
    const tag = sectionFor(t)==='wishlist' ? (t.planned ? ' · Planned (XXXX)' : ' · Wishlist') : ' · Memory';
    row.innerHTML = `
      <div class="row-left">
        <div class="row-title">${escapeHtml(placeLabel)}${t.year ? ` · ${t.year}` : ''}${tag}</div>
        <div class="row-sub">${escapeHtml(t.subtitle)}</div>
      </div>
      <button class="row-open"><i class="fa-solid fa-location-arrow"></i> Jump</button>
    `;
    row.querySelector('button').addEventListener('click', () => {
      const sec = sectionFor(t);
      if (state.section !== sec) {
        state.section = sec;
        saveSection();
        updateSectionUI();
        renderFeed();
      }
      closeModal();
      const idx = currentList().findIndex(x => x.id === t.id);
      if (idx >= 0) scrollToIndex(idx);
    });
    modalList.appendChild(row);
  });
}

function switchTo(section){
  if (state.section === section) return;
  state.section = section;
  saveSection();
  updateSectionUI();
  renderFeed();
  setActiveNav(navHome);
}

segMem.addEventListener('click', () => switchTo('memories'));
segWish.addEventListener('click', () => switchTo('wishlist'));

btnSearch.addEventListener('click', openSearchModal);

btnHelp.addEventListener('click', () => {
  searchField.style.display = 'none';
  noteField.style.display = 'none';
  openModal('Shortcuts');
  modalList.innerHTML = `
    <div class="row">
      <div class="row-left">
        <div class="row-title">Keyboard</div>
        <div class="row-sub">↑/↓ move · Enter open · / search · M/W switch · Esc close</div>
      </div>
    </div>
    <div class="row">
      <div class="row-left">
        <div class="row-title">Manifest</div>
        <div class="row-sub">Edit <b>manifest.json</b> to control Memories vs Wishlist.</div>
      </div>
    </div>
  `;
});

navHome.addEventListener('click', () => {
  setActiveNav(navHome);
  scrollToIndex(0);
});
navSearch.addEventListener('click', () => {
  setActiveNav(navSearch);
  openSearchModal();
});
navFav.addEventListener('click', openFavs);
navKeys.addEventListener('click', () => {
  setActiveNav(navKeys);
  btnHelp.click();
});

document.addEventListener('keydown', (e) => {
  if (modalBackdrop.classList.contains('show')) return;

  if (e.key === '/') {
    e.preventDefault();
    openSearchModal();
    return;
  }
  if (e.key.toLowerCase() === 'm') switchTo('memories');
  if (e.key.toLowerCase() === 'w') switchTo('wishlist');

  if (e.key === 'Enter') {
    const idx = getVisibleIndex();
    const list = currentList();
    const page = list[idx];
    if (page) openInNewTab(page.file);
    return;
  }
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    scrollToIndex(getVisibleIndex() + 1);
    return;
  }
  if (e.key === 'ArrowUp') {
    e.preventDefault();
    scrollToIndex(getVisibleIndex() - 1);
    return;
  }
  if (e.key === 'Escape') closeModal();
});

let scrollRaf = null;
feed.addEventListener('scroll', () => {
  if (scrollRaf) return;
  scrollRaf = requestAnimationFrame(() => {
    scrollRaf = null;
    updateDots();
  });
});

// Boot
(async function boot(){
  const man = await loadManifest();
  PAGES = await buildPagesFromManifest(man);

  const available = new Set(PAGES.map(p => p.section));
  if (!available.has(state.section)) state.section = available.has("memories") ? "memories" : "wishlist";

  updateSectionUI();
  renderFeed();
})();
</script>
